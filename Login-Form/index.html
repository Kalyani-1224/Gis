<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Registration Form</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <!-- Background Decorative Circles -->
    <div class="circle circle-one"></div>
    <div class="circle circle-two"></div>
    <div class="circle circle-three"></div>

    <!-- Registration Container -->
    <div class="registration-container">

      <div class="registration-card">

        <h1>Create Account</h1>

        <p class="subtitle">Register to get started</p>

        <form id="registrationForm" novalidate>

          <!-- Full Name -->
          <div class="form-group">

            <label for="fullName">
              Full Name
            </label>

            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Enter your full name"
              autocomplete="name"
            />

            <small
              id="nameError"
              class="error-message">
            </small>

          </div>


          <!-- Email -->
          <div class="form-group">

            <label for="email">
              Email Address
            </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
            />

            <small
              id="emailError"
              class="error-message">
            </small>

          </div>


          <!-- Mobile Number -->
          <div class="form-group">

            <label for="mobile">
              Mobile Number
            </label>

            <input
              type="tel"
              id="mobile"
              name="mobile"
              placeholder="Enter 10-digit mobile number"
              maxlength="10"
              inputmode="numeric"
              autocomplete="tel"
            />

            <small
              id="mobileError"
              class="error-message">
            </small>

          </div>


          <!-- Password -->
          <div class="form-group">

            <label for="password">
              Password
            </label>

            <div class="password-wrapper">

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="new-password"
              />

              <button
                type="button"
                class="toggle-password"
                id="togglePassword"
                aria-label="Show password">
                Show
              </button>

            </div>

            <small
              id="passwordError"
              class="error-message">
            </small>

          </div>


          <!-- Confirm Password -->
          <div class="form-group">

            <label for="confirmPassword">
              Confirm Password
            </label>

            <div class="password-wrapper">

              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm your password"
                autocomplete="new-password"
              />

              <button
                type="button"
                class="toggle-password"
                id="toggleConfirmPassword"
                aria-label="Show confirm password">
                Show
              </button>

            </div>

            <small
              id="confirmPasswordError"
              class="error-message">
            </small>

          </div>


          <!-- Address -->
          <div class="form-group">

            <label for="address">
              Address
            </label>

            <textarea
              id="address"
              name="address"
              rows="3"
              placeholder="Enter your address">
            </textarea>

            <small
              id="addressError"
              class="error-message">
            </small>

          </div>


          <!-- Submit Button -->
          <button
            type="submit"
            class="register-btn">
            Register
          </button>


          <!-- Success Message -->
          <p
            id="successMessage"
            class="success-message"
            role="status"
            aria-live="polite">
          </p>

        </form>

      </div>

    </div>


    <!-- Toast Container -->
    <div
      id="toastContainer"
      class="toast-container">
    </div>


    <script src="script.js"></script>

  </body>
</html>
