<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>GeoVision GIS - Login</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>
    <div class="login-container">
      <!-- Left GIS Branding -->
      <div class="login-brand">
        <div class="brand-content">
          <div class="brand-icon">
            <i class="fa-solid fa-earth-americas"></i>
          </div>

          <h1>GeoVision GIS</h1>

          <p>
            Advanced Geographic Information System for interactive spatial
            analysis.
          </p>

          <div class="gis-features">
            <div>
              <i class="fa-solid fa-map"></i>
              <span>Interactive Maps</span>
            </div>

            <div>
              <i class="fa-solid fa-layer-group"></i>
              <span>Layer Management</span>
            </div>

            <div>
              <i class="fa-solid fa-location-dot"></i>
              <span>Spatial Analysis</span>
            </div>

            <div>
              <i class="fa-solid fa-chart-line"></i>
              <span>GIS Dashboard</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Login Card -->
      <div class="login-section">
        <div class="login-card">
          <div class="mobile-logo">
            <i class="fa-solid fa-earth-americas"></i>
            <span>GeoVision GIS</span>
          </div>

          <h2>Welcome Back</h2>

          <p class="login-subtitle">Sign in to access the GIS dashboard</p>

          <form id="loginForm">
            <div class="input-group">
              <label for="username">Username</label>

              <div class="input-box">
                <i class="fa-solid fa-user"></i>

                <input
                  type="text"
                  id="username"
                  name="username"
                  placeholder="Enter username"
                  minlength="3"
                  maxlength="30"
                  autocomplete="username"
                  required
                />
              </div>
            </div>

            <div class="input-group">
              <label for="password">Password</label>

              <div class="input-box">
                <i class="fa-solid fa-lock"></i>

                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter password"
                  minlength="8"
                  maxlength="30"
                  autocomplete="current-password"
                  required
                />

                <button
                  type="button"
                  id="togglePassword"
                  class="password-toggle"
                  aria-label="Show or hide password"
                >
                  <i class="fa-solid fa-eye"></i>
                </button>
              </div>
            </div>

            <div class="login-options">
              <label class="remember">
                <input type="checkbox" />
                <span>Remember me</span>
              </label>

              <a href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="login-button">
              <span>Login to GIS</span>
              <i class="fa-solid fa-arrow-right"></i>
            </button>

            <div id="loginMessage" class="login-message"></div>
          </form>

          <div class="demo-info">
            <i class="fa-solid fa-circle-info"></i>

            <div>
              <strong>Demo Access</strong>

              <small> Username: admin | Password: admin123 </small>
            </div>
          </div>
        </div>
      </div>
    </div>
    

    <script src="js/login.js"></script>
  </body>
</html>
